# ==============================================================================
# TalabaGo (StudentHUB) — Single-Server All-in-One Deployment
# Backend (FastAPI) + Frontend (Next.js) + Database (PostgreSQL) + Nginx Proxy
# ==============================================================================

services:
  # 1. Database Service (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: talabago_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talabago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talabago_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-talabago}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talabago} -d ${POSTGRES_DB:-talabago}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - talabago_net

  # 2. Backend Service (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talabago_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-talabago}:${POSTGRES_PASSWORD:-talabago_secure_pass_2026}@db:5432/${POSTGRES_DB:-talabago}
      SECRET_KEY: ${SECRET_KEY:-your_super_secret_jwt_key_here}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - talabago_net

  # 3. Frontend Service (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talabago_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    networks:
      - talabago_net

  # 4. Nginx Reverse Proxy (Unified Single-Server Entrypoint)
  nginx:
    image: nginx:alpine
    container_name: talabago_proxy
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/uploads:/var/www/uploads:ro
    networks:
      - talabago_net

volumes:
  pgdata:
    name: talabago_pgdata

networks:
  talabago_net:
    name: talabago_network