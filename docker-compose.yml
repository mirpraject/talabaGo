# ==============================================================================
# TalabaGo v2.0 — Yagona Server All-in-One Docker Compose
# Hammasi bitta loyihada (FastAPI + Next.js yagona konteynerda)
# ==============================================================================

services:
  # 1. Database (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: talabago_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talabago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talabago_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-talabago}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talabago} -d ${POSTGRES_DB:-talabago}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - talabago_net

  # 2. Unified App (Next.js + FastAPI)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talabago_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-talabago}:${POSTGRES_PASSWORD:-talabago_secure_pass_2026}@db:5432/${POSTGRES_DB:-talabago}
      SECRET_KEY: ${SECRET_KEY:-talabago_secret_key_2026_jwt}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      PORT: 3000
    volumes:
      - ./uploads:/app/uploads
    networks:
      - talabago_net

volumes:
  pgdata:
    name: talabago_pgdata

networks:
  talabago_net:
    name: talabago_network